[package]
name = "custom-cursor-overlay"
version = "0.1.0"
edition = "2021"
description = "Overlay that shows only a custom cursor inside a user-defined region, built with egui 0.36 / eframe 0.36"

# Rendering backends.
#
# egui/eframe 0.36 defaults to the wgpu renderer, which can crash at startup
# with `0xc0000005` (STATUS_ACCESS_VIOLATION) on some Windows GPUs/drivers
# (see https://github.com/emilk/egui/issues/3686). We therefore default to
# the glow (OpenGL) backend, which is also the recommended backend for
# transparent windows. To use wgpu instead, enable the `wgpu` feature and
# run with `--backend wgpu`.
[features]
default = ["glow"]
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "x11", "web_screen_reader"] }
egui = "0.36.1"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"

# Windows: global cursor position (GetCursorPos) + system cursor visibility
# (ShowCursor) + direct click pass-through (WS_EX_TRANSPARENT).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
