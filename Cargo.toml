[package]
name = "custom-cursor-overlay"
version = "0.3.0"
edition = "2021"
description = "Pure-native Rust custom cursor overlay: a transparent always-on-top window owns the cursor inside a region (OS HCURSOR), forwards ALL input to the app below, and draws the region/status with GDI. No webview, no JS."

# 100% native (no webview): the overlay window is a transparent layered tao
# window. The cursor is a real OS HCURSOR built from a Rust bitmap and applied
# with SetCursor. Input is captured with WH_MOUSE_LL + WM_INPUT and forwarded
# to the app below via PostMessage. Region box + status are drawn with GDI
# into the layered window (UpdateLayeredWindow). Everything is Rust.

[dependencies]
tao = "0.37"
log = "0.4"
env_logger = "0.11"

# Windows: raw Win32 API via windows-sys — global cursor, real HCURSOR,
# click pass-through (WS_EX_TRANSPARENT), target-window tracking, low-level
# input (WH_MOUSE_LL / WH_KEYBOARD_LL / WM_INPUT), input forwarding
# (PostMessage) and GDI overlay rendering (UpdateLayeredWindow).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = 3
