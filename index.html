<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Custom Cursor Overlay</title>
<style>
  /* ---- fully transparent shell ----
     All logic / API / input lives in Rust. This page only *presents* what
     Rust pushes (region box + a small status line). The cursor itself is a
     native OS cursor built and applied by Rust (SetCursor), so this page has
     nothing to do with it. `cursor: none` while the overlay owns the cursor
     prevents WebView2 from drawing its own. */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: transparent;
    user-select: none; -webkit-user-select: none;
  }
  body:not(.owning) { cursor: default; }
  body.owning, body.owning * { cursor: none !important; }

  /* ---- region outline (dashed when shown, solid while editing) ---- */
  #region {
    position: fixed; z-index: 10; display: none;
    border: 2px dashed rgba(0,150,255,0.9);
    background: rgba(0,150,255,0.05);
    pointer-events: none;            /* never blocks input */
  }
  #region.editing {
    border: 2px solid #0096ff;
    background: rgba(0,150,255,0.10);
  }

  /* ---- passive status line (hotkeys hint) ---- */
  #status {
    position: fixed; left: 10px; top: 8px; z-index: 100;
    max-width: calc(100vw - 20px);
    font: 11px/1.5 "Segoe UI", system-ui, sans-serif;
    color: rgba(230,230,230,0.9);
    background: rgba(20,20,30,0.55);
    padding: 4px 8px; border-radius: 6px;
    pointer-events: none;            /* clicks pass through to the app below */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>

  <div id="region"></div>
  <div id="status">overlay…</div>

<script>
"use strict";
// Pure presentation: applies the state pushed by Rust. No API / IPC / logic.
window.__setState = function (s) {
  s = s || {};
  document.body.classList.toggle("owning", !!s.owning);

  var r = document.getElementById("region");
  var show = !!(s.editing || s.show_region);
  r.style.display = show ? "block" : "none";
  if (show) {
    var reg = s.region || { x: 0, y: 0, w: 0, h: 0 };
    r.style.left = reg.x + "px";
    r.style.top = reg.y + "px";
    r.style.width = Math.max(0, reg.w) + "px";
    r.style.height = Math.max(0, reg.h) + "px";
    r.classList.toggle("editing", !!s.editing);
  }

  document.getElementById("status").textContent = s.status || "";
};
</script>
</body>
</html>
